<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบจัดการรายรับ-รายจ่าย</title>

<!-- Google Font: Prompt -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { prompt: ['Prompt', 'sans-serif'] },
        colors: {
          primary:   '#E73F1E', /* แดงพริก - รายจ่าย/ปุ่มหลัก */
          secondary: '#FB6C00', /* ส้ม - รายรับ */
          accent:    '#F9B637', /* เหลืองอำพัน - ไฮไลต์/แบดจ์ */
          cream:     '#FFDD9C'  /* ครีมอ่อน - พื้นหลังการ์ด/โซนเน้น */
        }
      }
    }
  }
</script>

<!-- jQuery -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<!-- Chart.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>

<!-- SweetAlert2 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.12.4/sweetalert2.all.min.js"></script>

<!-- SheetJS (export Excel) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  body { font-family: 'Prompt', sans-serif; }
  .tab-content { animation: fadeIn .25s ease; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  .table-wrap::-webkit-scrollbar { height: 8px; }
  .table-wrap::-webkit-scrollbar-thumb { background:#F9B637; border-radius:9999px; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid #E73F1E; outline-offset: 2px;
  }
</style>
</head>

<body class="bg-orange-50 text-gray-700 min-h-screen flex flex-col">

  <!-- ============ HEADER ============ -->
  <header class="bg-white shadow-sm border-b border-orange-100 py-4 px-6 mb-6">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-primary text-white flex items-center justify-center font-bold text-xl shadow">
          ฿
        </div>
        <h1 class="text-2xl font-bold text-gray-800">ระบบจัดการรายรับ-รายจ่าย</h1>
      </div>
      <button id="btnExport" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium shadow transition flex items-center gap-2 text-sm">
        <span>📊</span> ส่งออกเป็น Excel
      </button>
    </div>
  </header>

  <!-- ============ MAIN CONTENT ============ -->
  <main class="max-w-6xl mx-auto px-4 w-full flex-grow mb-10">

    <!-- Overall Overview Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-orange-100 flex items-center justify-between">
        <div>
          <p class="text-xs text-gray-500 font-medium">รายรับรวมทั้งหมด</p>
          <p id="totalIncome" class="text-2xl font-bold text-secondary mt-1">฿0.00</p>
        </div>
        <div class="w-12 h-12 rounded-full bg-orange-100 text-secondary flex items-center justify-center text-xl">
          📈
        </div>
      </div>
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-orange-100 flex items-center justify-between">
        <div>
          <p class="text-xs text-gray-500 font-medium">รายจ่ายรวมทั้งหมด</p>
          <p id="totalExpense" class="text-2xl font-bold text-primary mt-1">฿0.00</p>
        </div>
        <div class="w-12 h-12 rounded-full bg-red-100 text-primary flex items-center justify-center text-xl">
          📉
        </div>
      </div>
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-orange-100 flex items-center justify-between">
        <div>
          <p class="text-xs text-gray-500 font-medium">ยอดคงเหลือรวม</p>
          <p id="totalNet" class="text-2xl font-bold text-gray-800 mt-1">฿0.00</p>
        </div>
        <div class="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-xl">
          💰
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- LEFT COLUMN: Form & Proportion Analytics -->
      <div class="lg:col-span-5 space-y-6">

        <!-- Add Transaction Form -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-orange-100">
          <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
            <span>➕</span> บันทึกรายการใหม่
          </h2>
          <form id="txForm" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">ประเภทรายการ</label>
              <div class="grid grid-cols-2 gap-2">
                <label class="cursor-pointer">
                  <input type="radio" name="type" value="income" class="peer hidden" checked>
                  <div class="py-2 px-4 text-center rounded-lg border border-gray-200 text-sm font-medium peer-checked:bg-secondary peer-checked:text-white peer-checked:border-secondary transition">
                    รายรับ (+)
                  </div>
                </label>
                <label class="cursor-pointer">
                  <input type="radio" name="type" value="expense" class="peer hidden">
                  <div class="py-2 px-4 text-center rounded-lg border border-gray-200 text-sm font-medium peer-checked:bg-primary peer-checked:text-white peer-checked:border-primary transition">
                    รายจ่าย (-)
                  </div>
                </label>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">จำนวนเงิน (บาท) *</label>
                <input type="number" id="txAmount" step="0.01" min="0" placeholder="0.00" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-1 focus:ring-primary">
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">วันที่ *</label>
                <input type="date" id="txDate" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-1 focus:ring-primary">
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">หมวดหมู่ *</label>
              <select id="txCategory" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-1 focus:ring-primary bg-white">
                <option value="">-- เลือกหมวดหมู่ --</option>
                <option value="อาหาร/เครื่องดื่ม">อาหาร/เครื่องดื่ม</option>
                <option value="การเดินทาง">การเดินทาง</option>
                <option value="ช้อปปิ้ง">ช้อปปิ้ง</option>
                <option value="เงินเดือน/รายได้">เงินเดือน/รายได้</option>
                <option value="บิล/ค่าน้ำค่าไฟ">บิล/ค่าน้ำค่าไฟ</option>
                <option value="บันเทิง/ท่องเที่ยว">บันเทิง/ท่องเที่ยว</option>
                <option value="อื่นๆ">อื่นๆ</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">หมายเหตุ</label>
              <input type="text" id="txNote" placeholder="ระบุรายละเอียดเพิ่มเติม (ถ้ามี)" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-1 focus:ring-primary">
            </div>

            <button type="submit" class="w-full py-2.5 bg-primary hover:bg-red-700 text-white font-medium rounded-lg shadow transition text-sm">
              บันทึกรายการ
            </button>
          </form>
        </div>

        <!-- Filter & Chart Proportion Section -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-orange-100">
          <h2 class="text-lg font-bold text-gray-800 mb-3 flex items-center gap-2">
            <span>🍰</span> สัดส่วนรายรับ - รายจ่าย
          </h2>

          <!-- Time Period Selector -->
          <div class="flex flex-wrap gap-1.5 p-1 bg-gray-100 rounded-lg mb-4 text-xs font-medium">
            <button class="filter-btn flex-1 py-1.5 rounded-md transition text-center active-tab bg-white shadow-sm font-semibold" data-period="daily">รายวัน</button>
            <button class="filter-btn flex-1 py-1.5 rounded-md transition text-center text-gray-600 hover:text-gray-900" data-period="weekly">รายสัปดาห์</button>
            <button class="filter-btn flex-1 py-1.5 rounded-md transition text-center text-gray-600 hover:text-gray-900" data-period="monthly">รายเดือน</button>
            <button class="filter-btn flex-1 py-1.5 rounded-md transition text-center text-gray-600 hover:text-gray-900" data-period="custom">กำหนดเอง</button>
          </div>

          <!-- Custom Date Input (Hidden by default) -->
          <div id="customDateRange" class="hidden grid grid-cols-2 gap-2 mb-4 p-3 bg-orange-50/50 rounded-lg border border-orange-100">
            <div>
              <label class="block text-[10px] font-semibold text-gray-500 mb-0.5">ตั้งแต่วันที่</label>
              <input type="date" id="customFrom" class="w-full px-2 py-1 text-xs border border-gray-200 rounded bg-white">
            </div>
            <div>
              <label class="block text-[10px] font-semibold text-gray-500 mb-0.5">ถึงวันที่</label>
              <input type="date" id="customTo" class="w-full px-2 py-1 text-xs border border-gray-200 rounded bg-white">
            </div>
          </div>

          <!-- Filter Summary Stats -->
          <div class="grid grid-cols-2 gap-2 mb-4 text-xs text-center">
            <div class="p-2 bg-orange-50 rounded-lg border border-orange-100">
              <span class="text-gray-500 block">รายรับช่วงนี้</span>
              <span id="periodIncome" class="font-bold text-secondary text-sm">฿0.00</span>
            </div>
            <div class="p-2 bg-red-50 rounded-lg border border-red-100">
              <span class="text-gray-500 block">รายจ่ายช่วงนี้</span>
              <span id="periodExpense" class="font-bold text-primary text-sm">฿0.00</span>
            </div>
          </div>

          <!-- Chart Area -->
          <div class="relative w-full h-56 flex items-center justify-center">
            <canvas id="proportionChart"></canvas>
          </div>
        </div>

      </div>

      <!-- RIGHT COLUMN: Transaction History Table -->
      <div class="lg:col-span-7">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-orange-100 h-full flex flex-col">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
            <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
              <span>📋</span> ประวัติรายการ
            </h2>
            <div class="w-full sm:w-48">
              <input type="text" id="searchInput" placeholder="ค้นหารายการ..." class="w-full px-3 py-1.5 border border-gray-200 rounded-lg text-xs focus:ring-1 focus:ring-primary">
            </div>
          </div>

          <!-- Table Wrapper -->
          <div class="table-wrap overflow-x-auto flex-grow">
            <table class="w-full text-left text-xs text-gray-600">
              <thead class="bg-orange-50 text-gray-700 font-semibold uppercase border-b border-orange-100">
                <tr>
                  <th class="py-3 px-3">วันที่</th>
                  <th class="py-3 px-3">ประเภท</th>
                  <th class="py-3 px-3">หมวดหมู่</th>
                  <th class="py-3 px-3">หมายเหตุ</th>
                  <th class="py-3 px-3 text-right">จำนวนเงิน</th>
                  <th class="py-3 px-3 text-center">จัดการ</th>
                </tr>
              </thead>
              <tbody id="txTableBody" class="divide-y divide-gray-100">
                <!-- Records injected by JS -->
              </tbody>
            </table>
            <div id="noData" class="hidden py-10 text-center text-gray-400 text-sm">
              ไม่พบข้อมูลรายการ
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- ============ JAVASCRIPT LOGIC ============ -->
  <script>
    let transactions = JSON.parse(localStorage.getItem('my_transactions')) || [];
    let currentPeriod = 'daily';
    let chartInstance = null;

    $(document).ready(function() {
      // Set default date to Today
      $('#txDate').val(new Date().toISOString().split('T')[0]);

      // Render Initial Data
      renderAll();

      // Form Submit Handler
      $('#txForm').on('submit', function(e) {
        e.preventDefault();

        const type = $('input[name="type"]:checked').val();
        const amount = parseFloat($('#txAmount').val());
        const date = $('#txDate').val();
        const category = $('#txCategory').val();
        const note = $('#txNote').val().trim();

        // Validate Inputs with SweetAlert
        if (!amount || amount <= 0 || !date || !category) {
          Swal.fire({
            icon: 'warning',
            title: 'กรุณากรอกข้อมูล',
            text: 'กรุณากรอกจำนวนเงิน, วันที่ และหมวดหมู่ให้ครบถ้วน',
            confirmButtonColor: '#E73F1E',
            customClass: { confirmButton: 'font-prompt' }
          });
          return;
        }

        const newTx = {
          id: Date.now(),
          type,
          amount,
          date,
          category,
          note
        };

        transactions.unshift(newTx);
        saveData();

        // Reset Form
        $('#txAmount').val('');
        $('#txNote').val('');

        // SweetAlert Success Notification
        Swal.fire({
          icon: 'success',
          title: 'บันทึกสำเร็จ',
          text: 'เพิ่มรายการเรียบร้อยแล้ว',
          timer: 1500,
          showConfirmButton: false,
          customClass: { popup: 'font-prompt' }
        });

        renderAll();
      });

      // Filter Period Buttons
      $('.filter-btn').on('click', function() {
        $('.filter-btn').removeClass('active-tab bg-white shadow-sm font-semibold text-gray-900').addClass('text-gray-600');
        $(this).addClass('active-tab bg-white shadow-sm font-semibold text-gray-900').removeClass('text-gray-600');

        currentPeriod = $(this).data('period');

        if (currentPeriod === 'custom') {
          $('#customDateRange').removeClass('hidden');
        } else {
          $('#customDateRange').addClass('hidden');
        }

        updateChartAndSummary();
      });

      // Custom Date Inputs Listener
      $('#customFrom, #customTo').on('change', function() {
        if (currentPeriod === 'custom') {
          updateChartAndSummary();
        }
      });

      // Search Handler
      $('#searchInput').on('input', function() {
        renderTable();
      });

      // Export to Excel
      $('#btnExport').on('click', function() {
        if (transactions.length === 0) {
          Swal.fire({
            icon: 'info',
            title: 'ไม่มีข้อมูล',
            text: 'ไม่มีข้อมูลสำหรับส่งออก Excel',
            confirmButtonColor: '#FB6C00'
          });
          return;
        }

        const exportData = transactions.map((t, idx) => ({
          'ลำดับ': idx + 1,
          'วันที่': t.date,
          'ประเภท': t.type === 'income' ? 'รายรับ' : 'รายจ่าย',
          'หมวดหมู่': t.category,
          'จำนวนเงิน (บาท)': t.amount,
          'หมายเหตุ': t.note || '-'
        }));

        const worksheet = XLSX.utils.json_to_sheet(exportData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "รายรับ-รายจ่าย");
        XLSX.writeFile(workbook, `บัญชีรายรับรายจ่าย_${new Date().toISOString().split('T')[0]}.xlsx`);
      });
    });

    // Save Data to LocalStorage
    function saveData() {
      localStorage.setItem('my_transactions', JSON.stringify(transactions));
    }

    // Delete Item with SweetAlert Confirmation
    function deleteItem(id) {
      Swal.fire({
        title: 'ยืนยันการลบรายการ?',
        text: 'ข้อมูลรายการนี้จะถูกลบออกอย่างถาวร',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#E73F1E',
        cancelButtonColor: '#6B7280',
        confirmButtonText: 'ใช่, ลบรายการ',
        cancelButtonText: 'ยกเลิก',
        customClass: { confirmButton: 'font-prompt', cancelButton: 'font-prompt' }
      }).then((result) => {
        if (result.isConfirmed) {
          transactions = transactions.filter(t => t.id !== id);
          saveData();
          renderAll();

          Swal.fire({
            icon: 'success',
            title: 'ลบเรียบร้อย',
            text: 'ลบรายการสำเร็จแล้ว',
            timer: 1200,
            showConfirmButton: false
          });
        }
      });
    }

    // Main Render Function
    function renderAll() {
      renderTable();
      calculateTotals();
      updateChartAndSummary();
    }

    // Calculate Overall Cards
    function calculateTotals() {
      let income = 0;
      let expense = 0;

      transactions.forEach(t => {
        if (t.type === 'income') income += t.amount;
        else expense += t.amount;
      });

      $('#totalIncome').text(`฿${income.toLocaleString('th-TH', {minimumFractionDigits: 2})}`);
      $('#totalExpense').text(`฿${expense.toLocaleString('th-TH', {minimumFractionDigits: 2})}`);
      $('#totalNet').text(`฿${(income - expense).toLocaleString('th-TH', {minimumFractionDigits: 2})}`);
    }

    // Render Transaction Table
    function renderTable() {
      const search = $('#searchInput').val().toLowerCase();
      const $tbody = $('#txTableBody').empty();

      const filtered = transactions.filter(t => 
        t.category.toLowerCase().includes(search) || 
        (t.note && t.note.toLowerCase().includes(search)) ||
        t.date.includes(search)
      );

      if (filtered.length === 0) {
        $('#noData').removeClass('hidden');
        return;
      } else {
        $('#noData').addClass('hidden');
      }

      filtered.forEach(t => {
        const isIncome = t.type === 'income';
        const badgeClass = isIncome ? 'bg-orange-100 text-secondary' : 'bg-red-100 text-primary';
        const amountClass = isIncome ? 'text-secondary font-semibold' : 'text-primary font-semibold';
        const amountPrefix = isIncome ? '+' : '-';

        const tr = `
          <tr class="hover:bg-orange-50/50 transition">
            <td class="py-2.5 px-3 font-medium whitespace-nowrap">${t.date}</td>
            <td class="py-2.5 px-3">
              <span class="px-2 py-0.5 rounded-full text-[10px] font-medium ${badgeClass}">
                ${isIncome ? 'รายรับ' : 'รายจ่าย'}
              </span>
            </td>
            <td class="py-2.5 px-3">${t.category}</td>
            <td class="py-2.5 px-3 text-gray-500 max-w-[150px] truncate">${t.note || '-'}</td>
            <td class="py-2.5 px-3 text-right ${amountClass}">
              ${amountPrefix}฿${t.amount.toLocaleString('th-TH', {minimumFractionDigits: 2})}
            </td>
            <td class="py-2.5 px-3 text-center">
              <button onclick="deleteItem(${t.id})" class="text-gray-400 hover:text-red-500 p-1 transition" title="ลบ">
                🗑️
              </button>
            </td>
          </tr>
        `;
        $tbody.append(tr);
      });
    }

    // Filter Transactions By Time Period
    function getFilteredTransactionsByPeriod() {
      const now = new Date();
      
      return transactions.filter(t => {
        const tDate = new Date(t.date + 'T00:00:00');

        if (currentPeriod === 'daily') {
          const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          return tDate.getTime() === today.getTime();
        } else if (currentPeriod === 'weekly') {
          const weekAgo = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 7);
          return tDate >= weekAgo && tDate <= now;
        } else if (currentPeriod === 'monthly') {
          return tDate.getMonth() === now.getMonth() && tDate.getFullYear() === now.getFullYear();
        } else if (currentPeriod === 'custom') {
          const from = $('#customFrom').val() ? new Date($('#customFrom').val() + 'T00:00:00') : null;
          const to = $('#customTo').val() ? new Date($('#customTo').val() + 'T23:59:59') : null;

          if (from && tDate < from) return false;
          if (to && tDate > to) return false;
          return true;
        }
        return true;
      });
    }

    // Update Proportion Chart & Summary
    function updateChartAndSummary() {
      const filtered = getFilteredTransactionsByPeriod();

      let pIncome = 0;
      let pExpense = 0;

      filtered.forEach(t => {
        if (t.type === 'income') pIncome += t.amount;
        else pExpense += t.amount;
      });

      $('#periodIncome').text(`฿${pIncome.toLocaleString('th-TH', {minimumFractionDigits: 2})}`);
      $('#periodExpense').text(`฿${pExpense.toLocaleString('th-TH', {minimumFractionDigits: 2})}`);

      // Chart.js Update
      const ctx = document.getElementById('proportionChart').getContext('2d');

      if (chartInstance) {
        chartInstance.destroy();
      }

      if (pIncome === 0 && pExpense === 0) {
        // Draw Empty State Chart
        chartInstance = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['ไม่มีข้อมูล'],
            datasets: [{
              data: [1],
              backgroundColor: ['#E5E7EB']
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom' },
              tooltip: { enabled: false }
            }
          }
        });
        return;
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['รายรับ (%)', 'รายจ่าย (%)'],
          datasets: [{
            data: [pIncome, pExpense],
            backgroundColor: ['#FB6C00', '#E73F1E'],
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { font: { family: 'Prompt', size: 12 } }
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const total = pIncome + pExpense;
                  const val = context.raw;
                  const pct = total > 0 ? ((val / total) * 100).toFixed(1) : 0;
                  return ` ${context.label.split(' ')[0]}: ฿${val.toLocaleString('th-TH')} (${pct}%)`;
                }
              }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
